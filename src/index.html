<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Upload and Text Extraction</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        input[type="file"],
        input[type="text"] {
            margin-bottom: 10px;
        }

        button {
            margin-top: 10px;
        }

        #response,
        #textResponse {
            margin-top: 20px;
            font-weight: bold;
        }

        .select-container {
            margin-top: 10px;
        }

        .input-container {
            margin-top: 10px;
        }

        #fileLocationInput {
            width: 600px;
            /* Or any desired width */
        }

        #loading-overlay {
            /* visibility: hidden; */
            display: none;
            /* Initially hidden */
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            /* Semi-transparent background */
            z-index: 1000;
            /* Ensure it's on top */
            justify-content: center;
            align-items: center;
            /* display: flex; */
        }

        #loading-message {
            font-size: 2em;
            color: white;
        }

        #file-content {
            width: 100%;
            height: 300px;
            margin-top: 10px;
        }
    </style>
</head>

<body>
    <h1>Upload PDF File</h1>

    <div class="select-container">
        <label for="company">Select Companies:</label>
        <!-- multiple -->
        <select id="company">
            <option value="ComA">Company A</option>
            <option value="ComB">Company B</option>
            <option value="ComC">Company C</option>
            <!-- Add more companies here -->
        </select>
    </div>

    <div class="select-container">
        <label for="reportYear">Select Report Year:</label>
        <select id="reportYear">
            <option value="2023">2023</option>
            <option value="2022">2022</option>
            <option value="2021">2021</option>
            <!-- Add more years here -->
        </select>
    </div>
    <div class="input-container">
        <label for="header-height">Header Height (%):</label>
        <input type="number" id="header-height" min="5" max="20" step="1" value="5">
    </div>

    <div class="input-container">
        <label for="footer-height">Footer Height (%):</label>
        <input type="number" id="footer-height" min="5" max="20" step="1" value="5">
    </div>
    <input type="file" id="fileInput" accept="application/pdf">
    <button onclick="uploadFileV2()">Upload and Process</button>

    <div id="response"></div>
    <div id="loading-overlay">
        <div id="loading-message">Loading...</div>
    </div>

    <!-- <h1>Extract Text from PDF</h1> -->
    <!-- <input type="text" id="fileLocationInput" placeholder="Enter file location" maxlength="200"> -->


    <div>
        <h2>Load Text File</h2>
        <!-- <input type="text" id="filePathInput" placeholder="Enter file path"> -->
        <label for="fileLocationInput">File Location:</label>
        <!-- <input type="text" id="fileLocationInput" readonly> -->
        <input type="text" id="fileLocationInput">
        <button onclick="loadTextFile()">Load</button>
        <textarea id="file-content"></textarea>
    </div>


    <!-- <button onclick="extractText()">Extract Text</button>

    <div id="textResponse"></div> -->

    <h1>Extract Relevant ESG Sentences</h1>
    <input type="text" id="esgIndicators" placeholder="Enter ESG indicators, separated by commas">
    <button onclick="extractESGSentences()">Extract ESG Sentences</button>

    <div id="esgResponse"></div>

    <script>
        async function uploadFileV2() {
            const fileInput = document.getElementById('fileInput');
            const company = document.getElementById('company').value;
            const reportYear = document.getElementById('reportYear').value;
            const headerHeight = document.getElementById('header-height').value;
            const footerHeight = document.getElementById('footer-height').value;
            const responseDiv = document.getElementById('response');
            const fileLocationInput = document.getElementById('fileLocationInput');


            if (!fileInput.files.length) {
                responseDiv.innerText = 'Please select a file.';
                return;
            }

            const formData = new FormData();
            formData.append('file', fileInput.files[0]);
            formData.append('company', company);
            formData.append('reportYear', reportYear);
            formData.append('header_height_percent', headerHeight / 100);
            formData.append('footer_height_percent', footerHeight / 100);

            responseDiv.innerText = ''; // Clear previous messages

            // document.getElementById('loading-overlay').style.visibility = 'visible';
            document.body.style.overflow = 'hidden'; //Prevent scrolling while loading
            document.getElementById('loading-overlay').style.display = 'flex'; // Show overlay
            try {
                const response = await fetch('/process-pdf', { // Changed to /process-pdf
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();
                document.getElementById('loading-overlay').style.display = 'none'; // Hide overlay
                // document.getElementById('loading-overlay').style.visibility = 'hidden';
                document.body.style.overflow = 'auto'; // Allow scrolling again

                if (response.ok) {
                    responseDiv.innerText = data.message; // Display the success message
                    fileLocationInput.value = data.output_filepath
                } else {
                    responseDiv.innerText = 'Error: ' + (data.error || 'Unknown error');
                }
            } catch (error) {
                document.getElementById('loading-overlay').style.display = 'none'; // Hide overlay
                // document.getElementById('loading-overlay').style.visibility = 'hidden';
                document.body.style.overflow = 'auto'; // Allow scrolling again
                responseDiv.innerText = 'Error: ' + error.message;
            }
        }


        async function uploadFile() {
            const fileInput = document.getElementById('fileInput');
            const companySelect = document.getElementById('company');
            const reportYearSelect = document.getElementById('reportYear');
            const responseDiv = document.getElementById('response');
            const fileLocationInput = document.getElementById('fileLocationInput');

            if (!fileInput.files.length) {
                responseDiv.innerText = 'Please select a file.';
                return;
            }

            const company = companySelect.value;
            const reportYear = reportYearSelect.value;

            const formData = new FormData();
            formData.append('file', fileInput.files[0]);
            formData.append('company', company);
            formData.append('reportYear', reportYear);


            try {
                const response = await fetch('/upload', {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();
                if (response.ok) {
                    responseDiv.innerText = 'File uploaded successfully! Location: ';
                    //  + data.file_location;
                    fileLocationInput.value = data.file_location;
                } else {
                    responseDiv.innerText = 'Error: ' + (data.error || 'Unknown error');
                }
            } catch (error) {
                responseDiv.innerText = 'Error: ' + error.message;
            }
        }

        async function loadTextFile() {
            const filePathInput = document.getElementById('fileLocationInput');
            const fileContentArea = document.getElementById('file-content');
            const filePath = filePathInput.value;
            const loadingIndicator = document.getElementById('loading-overlay');

            if (!filePath) {
                alert('Please enter a file path.');
                return;
            }

            loadingIndicator.style.display = 'flex';
            fileContentArea.value = '';

            try {
                const response = await fetch(`/load-text-file?path=${encodeURIComponent(filePath)}`);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const data = await response.text();
                fileContentArea.value = data;
            } catch (error) {
                console.error('Error loading file:', error);
            } finally {
                loadingIndicator.style.display = 'none';
            }
        }


        async function extractText() {
            const fileLocationInput = document.getElementById('fileLocationInput');
            const headerHeight = document.getElementById('header-height').value;
            const footerHeight = document.getElementById('footer-height').value;
            const textResponseDiv = document.getElementById('textResponse');

            let fileLocation = fileLocationInput.value.trim(); // Trim white spaces

            if (!fileLocation) {
                textResponseDiv.innerText = 'Please enter a file location.';
                return;
            }

            // Ensure the file location is URL-encoded
            const encodedFileLocation = encodeURIComponent(fileLocation);
            const header_height_percent = headerHeight / 100;
            const footer_height_percent = footerHeight / 100;

            try {
                const response = await fetch('/extract-text', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        file_location: encodedFileLocation,
                        header_height_percent: header_height_percent,
                        footer_height_percent: footer_height_percent
                    }),
                });
                const data = await response.json();

                if (response.ok) {
                    textResponseDiv.innerText = 'Extracted Text: ' + data.extracted_text;
                } else {
                    textResponseDiv.innerText = 'Error: ' + (data.error || 'Unknown error');
                }
            } catch (error) {
                textResponseDiv.innerText = 'Error: ' + error.message;
            }
        }

        async function extractESGSentences() {
            const esgIndicatorsInput = document.getElementById('esgIndicators');
            const esgResponseDiv = document.getElementById('esgResponse');

            const esgIndicators = esgIndicatorsInput.value.split(',').map(item => item.trim());
            const extractedText = document.getElementById('textResponse').innerText || '';

            if (esgIndicators.length === 0 || !extractedText) {
                esgResponseDiv.innerText = 'Please enter ESG indicators and ensure text is extracted.';
                return;
            }

            try {
                const response = await fetch('/extract-esg-sentences', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        extracted_text: extractedText.replace('Extracted Text: ', ''),
                        esg_indicators: esgIndicators
                    }),
                });
                const data = await response.json();

                if (response.ok) {
                    if (data.relevant_sentences.length > 0) {
                        esgResponseDiv.innerText = 'Relevant ESG Sentences: ' + data.relevant_sentences.join(', ');
                    } else {
                        esgResponseDiv.innerText = 'No relevant sentences found for the given ESG indicators.';
                    }
                } else {
                    esgResponseDiv.innerText = 'Error: ' + (data.error || 'Unknown error');
                }
            } catch (error) {
                esgResponseDiv.innerText = 'Error: ' + error.message;
            }
        }

        async function extractESGSentences() {
            const esgIndicatorsInput = document.getElementById('esgIndicators');
            const esgResponseDiv = document.getElementById('esgResponse');

            const esgIndicators = esgIndicatorsInput.value.split(',').map(item => item.trim());
            const extractedText = document.getElementById('textResponse').innerText || '';

            if (esgIndicators.length === 0 || !extractedText) {
                esgResponseDiv.innerText = 'Please enter ESG indicators and ensure text is extracted.';
                return;
            }

            // Step 1: Extract relevant ESG sentences
            try {
                const response = await fetch('/extract-esg-sentences', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        extracted_text: extractedText.replace('Extracted Text: ', ''),
                        esg_indicators: esgIndicators
                    }),
                });
                const data = await response.json();

                if (!response.ok) {
                    esgResponseDiv.innerText = 'Error: ' + (data.error || 'Unknown error');
                    return;
                }

                const relevantSentences = data.relevant_sentences;

                if (relevantSentences.length > 0) {
                    // Step 2: Send relevant ESG sentences to ChatGPT
                    const chatGptResponse = await fetch('/process-esg-data', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            sentences: relevantSentences
                        }),
                    });
                    const chatGptData = await chatGptResponse.json();

                    if (chatGptResponse.ok) {
                        esgResponseDiv.innerText = 'Extracted Metric Values: ' + chatGptData.metric_values;
                    } else {
                        esgResponseDiv.innerText = 'ChatGPT Error: ' + (chatGptData.error || 'Unknown error');
                    }
                } else {
                    esgResponseDiv.innerText = 'No relevant sentences found for the given ESG indicators.';
                }
            } catch (error) {
                esgResponseDiv.innerText = 'Error: ' + error.message;
            }
        }
    </script>
</body>

</html>
